{{- $fullname := include "gpu-telemetry.fullname" . -}}
{{- $dbSecret := default (printf "%s-db" $fullname) .Values.postgresql.existingSecret -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-streamer
  labels: {{- include "gpu-telemetry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.streamer.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: streamer, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: streamer, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: {{ .Values.streamer.metricsPort | quote }}}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: streamer
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/streamer]
          ports: [{name: metrics, containerPort: {{ .Values.streamer.metricsPort }}}]
          env:
            - {name: QUEUE_ADDR, value: "{{ $fullname }}-queue:7000"}
            - {name: METRICS_LISTEN_ADDR, value: ":{{ .Values.streamer.metricsPort }}"}
            - {name: CSV_PATH, value: {{ ternary "/input/input.csv" .Values.streamer.csvPath (ne .Values.streamer.inputPVC "") | quote }}}
            - {name: DATASET_ID, value: {{ .Values.streamer.datasetID | quote }}}
            - {name: STREAMER_ID, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: STREAM_ROWS_PER_SECOND, value: {{ .Values.streamer.rowsPerSecond | quote }}}
            - {name: STREAM_BATCH_SIZE, value: {{ .Values.streamer.batchSize | quote }}}
            - {name: STREAM_HEARTBEAT_INTERVAL, value: {{ .Values.streamer.heartbeatInterval | quote }}}
          resources: {{- toYaml .Values.streamer.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, initialDelaySeconds: 2, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          {{- if .Values.streamer.inputPVC }}
          volumeMounts: [{name: input, mountPath: /input, readOnly: true}]
          {{- end }}
      {{- if .Values.streamer.inputPVC }}
      volumes: [{name: input, persistentVolumeClaim: {claimName: {{ .Values.streamer.inputPVC }}}}]
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-collector
  labels: {{- include "gpu-telemetry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.collector.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: collector, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: collector, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: {{ .Values.collector.metricsPort | quote }}}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/migrate]
          env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ $dbSecret }}, key: database-url}}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      containers:
        - name: collector
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/collector]
          ports: [{name: metrics, containerPort: {{ .Values.collector.metricsPort }}}]
          env:
            - {name: QUEUE_ADDR, value: "{{ $fullname }}-queue:7000"}
            - {name: METRICS_LISTEN_ADDR, value: ":{{ .Values.collector.metricsPort }}"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ $dbSecret }}, key: database-url}}}
            - {name: COLLECTOR_ID, valueFrom: {fieldRef: {fieldPath: metadata.name}}}
            - {name: COLLECTOR_BATCH_SIZE, value: {{ .Values.collector.batchSize | quote }}}
          resources: {{- toYaml .Values.collector.resources | nindent 12 }}
          readinessProbe: {httpGet: {path: /readyz, port: metrics}, initialDelaySeconds: 2, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: metrics}, initialDelaySeconds: 10, periodSeconds: 10}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "gpu-telemetry.labels" . | nindent 4 }}
spec:
  type: {{ .Values.api.serviceType }}
  selector: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}
  ports: [{name: http, port: {{ .Values.api.port }}, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels: {{- include "gpu-telemetry.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/component: api, app.kubernetes.io/instance: {{ .Release.Name }}}
      annotations: {prometheus.io/scrape: "true", prometheus.io/port: {{ .Values.api.port | quote }}}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/migrate]
          env: [{name: DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ $dbSecret }}, key: database-url}}}]
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [/app/api]
          ports: [{name: http, containerPort: {{ .Values.api.port }}}]
          env:
            - {name: API_LISTEN_ADDR, value: ":{{ .Values.api.port }}"}
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: {{ $dbSecret }}, key: database-url}}}
            - {name: API_MAX_RESULT_ROWS, value: {{ .Values.api.maxResultRows | quote }}}
            - {name: API_MAX_RESULT_BYTES, value: {{ printf "%.0f" .Values.api.maxResultBytes | quote }}}
          readinessProbe: {httpGet: {path: /readyz, port: http}, initialDelaySeconds: 2, periodSeconds: 3}
          livenessProbe: {httpGet: {path: /healthz, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
