name: ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - uses: azure/setup-helm@v4
      - run: make lint
      - run: make test
      - run: make coverage-check
      - run: make integration
      - run: make openapi-check
      - run: make helm-lint
      - run: make build
      - run: docker build --tag gpu-telemetry:ci .
